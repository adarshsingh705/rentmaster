<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentMaster — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #2A2D35; display: flex; justify-content: center; align-items: flex-start; padding: 48px 20px 80px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
:root {
  --navy: #1C2537; --navy2: #6B5B45; --saffron: #C8A96E;
  --t1: #1C2537; --t2: #6B5B45; --t3: #9B8E7E;
  --card: #FAF8F5; --bg: #F0EDE8; --border: #E2D9CC;
  --sh: 0 1px 3px rgba(28,37,55,.06), 0 2px 8px rgba(28,37,55,.05);
  --paid: #0E9F6E; --pend: #D97706; --late: #DC2020;
}
.phone { width: 375px; background: var(--bg); border-radius: 40px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.28), 0 4px 16px rgba(0,0,0,.1); border: 1px solid rgba(255,255,255,.08); }
.scroll { height: 780px; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.hero-top { background: var(--navy); padding: 52px 24px 28px; position: relative; overflow: hidden; }
.hero-top::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.03); }
.logo { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.02em; margin-bottom: 18px; }
.logo span { color: var(--saffron); }
.hero-headline { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -.03em; line-height: 1.15; margin-bottom: 8px; }
.hero-sub { font-size: 13px; color: rgba(255,255,255,.5); line-height: 1.6; }
.form-area { padding: 22px 20px 28px; }
.tabs { display: flex; background: var(--border); border-radius: 10px; padding: 3px; margin-bottom: 22px; }
.tab { flex: 1; padding: 8px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; background: transparent; color: var(--t2); transition: all .15s; }
.tab.active { background: var(--card); color: var(--t1); box-shadow: var(--sh); }
.panel { display: none; }
.panel.active { display: block; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--t2); display: block; margin-bottom: 6px; }
.form-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--t1); font-family: inherit; background: var(--card); outline: none; transition: border-color .15s; }
.form-input:focus { border-color: var(--navy); }
.form-input::placeholder { color: var(--t3); }
.input-wrap { position: relative; }
.eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--t3); cursor: pointer; background: none; border: none; padding: 0; }
.forgot { font-size: 12px; color: var(--navy); font-weight: 600; display: block; text-align: right; margin-top: 6px; text-decoration: none; }
.btn-primary { width: 100%; padding: 13px; background: var(--navy); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 4px; transition: opacity .15s; }
.or-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--t3); font-size: 12px; }
.or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.btn-google { width: 100%; padding: 11px; background: var(--card); color: var(--t1); border: 1.5px solid var(--border); border-radius: 12px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.switch-text { text-align: center; margin-top: 18px; font-size: 12px; color: var(--t2); }
.switch-text a { color: var(--navy); font-weight: 600; text-decoration: none; cursor: pointer; }
.trust-row { display: flex; justify-content: center; gap: 14px; padding: 16px 20px 24px; border-top: 1px solid var(--border); }
.trust-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--t3); font-weight: 500; }
.strength-bar { height: 3px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
.strength-fill { height: 100%; width: 40%; background: var(--pend); border-radius: 2px; }
</style>
</head>
<body>
<div class="phone"><div class="scroll">
  <div class="hero-top">
    <div class="logo">Rent<span>Master</span></div>
    <div class="hero-headline">Your PG.<br>Fully Automated.</div>
    <div class="hero-sub">Collect rent, send reminders, track every payment — from one clean dashboard.</div>
  </div>
  <div class="form-area">
    <div class="tabs">
      <button class="tab active" onclick="showPanel('signin',this)">Sign in</button>
      <button class="tab" onclick="showPanel('signup',this)">Create account</button>
    </div>
    <div class="panel active" id="signin">
      <div class="form-group"><label class="form-label">Email address</label><input class="form-input" type="email" value="Adarshsingh@gmail.com"></div>
      <div class="form-group"><label class="form-label">Password</label><div class="input-wrap"><input class="form-input" type="password" value="••••••••" style="padding-right:40px"><button class="eye-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><a class="forgot" href="#">Forgot password?</a></div>
      <button class="btn-primary" onclick="location.href='dashboard-mobile.html'">Sign in</button>
      <div class="or-divider">or continue with</div>
      <button class="btn-google" onclick="location.href='dashboard-mobile.html'"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Continue with Google</button>
      <div class="switch-text">No account? <a onclick="showPanel('signup',document.querySelectorAll('.tab')[1])">Sign up free</a></div>
    </div>
    <div class="panel" id="signup">
      <div class="form-group"><label class="form-label">Full name</label><input class="form-input" type="text" placeholder="Adarsh Singh"></div>
      <div class="form-group"><label class="form-label">Email address</label><input class="form-input" type="email" placeholder="you@example.com"></div>
      <div class="form-group"><label class="form-label">Password</label><div class="input-wrap"><input class="form-input" type="password" placeholder="Minimum 8 characters" style="padding-right:40px"><button class="eye-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="strength-bar"><div class="strength-fill"></div></div></div>
      <button class="btn-primary" onclick="location.href='dashboard-mobile.html'">Create account</button>
      <div class="or-divider">or</div>
      <button class="btn-google" onclick="location.href='dashboard-mobile.html'"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Sign up with Google</button>
      <div class="switch-text">Have an account? <a onclick="showPanel('signin',document.querySelectorAll('.tab')[0])">Sign in</a></div>
    </div>
  </div>
  <div class="trust-row">
    <div class="trust-item"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Cashfree Secured</div>
    <div class="trust-item"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Made for India</div>
    <div class="trust-item"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>15-min setup</div>
  </div>
</div></div>
<script>
function showPanel(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
