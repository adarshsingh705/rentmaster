<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentMaster — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #E6E8EF;
      color: #0F1623;
      display: flex;
      justify-content: center;
      padding: 48px 20px 80px;
      -webkit-font-smoothing: antialiased;
    }

    /* SHELL */
    .phone {
      width: 375px;
      background: #EEF0F6;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(15, 22, 35, .18), 0 4px 16px rgba(15, 22, 35, .08);
      border: 1px solid rgba(255, 255, 255, .9);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    :root {
      --navy: #1B2D4F;
      --t1: #0F1623;
      --t2: #5A6473;
      --t3: #9CA3AE;
      --card: #FFFFFF;
      --border: #E0E4EE;
      --bg: #EEF0F6;
      --sh: 0 2px 8px rgba(15, 22, 35, .07), 0 1px 2px rgba(15, 22, 35, .04);
      --late: #DC2020;
      --late-bg: rgba(220, 32, 32, .08);
      --paid: #0E9F6E;
      --paid-bg: rgba(14, 159, 110, .09);
    }

    /* NAV BAR (back) */
    .nav-bar {
      display: flex;
      align-items: center;
      padding: 20px 18px 0;
      flex-shrink: 0;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--t2);
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--t1);
      flex: 1;
      text-align: center;
      letter-spacing: -.01em;
      margin-right: 36px;
      /* balance the back button */
    }

    /* SCROLLABLE */
    .scroll {
      height: 750px;
      overflow-y: auto;
      padding: 20px 18px 32px;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
    }

    .scroll::-webkit-scrollbar {
      display: none;
    }

    /* AVATAR SECTION */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 24px;
    }

    .avatar-wrap {
      position: relative;
      cursor: pointer;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -.01em;
      border: 3px solid #fff;
      box-shadow: 0 4px 16px rgba(27, 45, 79, .22);
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--border);
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--t3);
    }

    .avatar-hint {
      font-size: 11px;
      color: var(--t3);
      margin-top: 10px;
      font-weight: 500;
    }

    .avatar-hint span {
      background: rgba(15, 22, 35, .06);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--t3);
      margin-left: 4px;
    }

    /* FORM CARD */
    .form-card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 22px;
      margin-bottom: 16px;
    }

    .form-card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--t3);
      margin-bottom: 18px;
    }

    /* FORM FIELDS */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--t1);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-opt {
      font-size: 11px;
      font-weight: 400;
      color: var(--t3);
      letter-spacing: 0;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      color: var(--t1);
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }

    .form-input:focus {
      border-color: var(--navy);
    }

    .form-input::placeholder {
      color: var(--t3);
    }

    .form-input.readonly {
      background: var(--bg);
      color: var(--t2);
      cursor: not-allowed;
      border-color: transparent;
    }

    .form-input.gstin {
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600;
      font-size: 13px;
    }

    /* FIELD HINT & ERROR */
    .form-hint {
      font-size: 11px;
      color: var(--t3);
      margin-top: 5px;
      line-height: 1.5;
    }

    .form-hint code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: rgba(15, 22, 35, .06);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10.5px;
      color: var(--t2);
      letter-spacing: .04em;
    }

    .form-error {
      font-size: 12px;
      color: var(--late);
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* DIVIDER WITHIN FORM */
    .form-div {
      height: 1px;
      background: var(--border);
      margin: 18px 0;
    }

    /* ACCOUNT INFO CARD */
    .info-card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .info-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--t2);
    }

    .info-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--t1);
    }

    .info-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--paid-bg);
      color: var(--paid);
    }

    .info-div {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* SAVE BUTTON */
    .btn-save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(27, 45, 79, .22);
      transition: opacity .15s;
      margin-top: auto;
    }

    .btn-save:hover {
      opacity: .88;
    }

    .btn-save:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* UNSAVED BANNER */
    .unsaved-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(217, 119, 6, .07);
      border: 1px solid rgba(217, 119, 6, .2);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .unsaved-text {
      font-size: 12px;
      font-weight: 500;
      color: #7a4a00;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <div class="phone">

    <!-- NAV BAR -->
    <div class="nav-bar">
      <div class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </div>
      <div class="nav-title">Profile</div>
    </div>

    <!-- SCROLL CONTENT -->
    <div class="scroll">

      <!-- AVATAR SECTION -->
      <div class="avatar-section">
        <div class="avatar-wrap">
          <div class="avatar-circle">VA</div>
          <div class="avatar-edit-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z" />
              <circle cx="12" cy="13" r="3" />
            </svg>
          </div>
        </div>
        <div class="avatar-hint">Profile photo <span>Phase 2</span></div>
      </div>

      <!-- PROFILE FORM — unsaved state (showing user actively editing) -->
      <!-- Comment: below shows the "unsaved changes" state with Save enabled -->
      <div class="unsaved-banner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" x2="12" y1="8" y2="12" />
          <line x1="12" x2="12.01" y1="16" y2="16" />
        </svg>
        <span class="unsaved-text">You have unsaved changes</span>
      </div>

      <!-- PERSONAL INFO -->
      <div class="form-card">
        <div class="form-card-title">Personal Info</div>

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label">
            Full Name
          </label>
          <input class="form-input" type="text" value="Adarsh singh" placeholder="Your full name">
        </div>

        <!-- Email (read-only) -->
        <div class="form-group">
          <label class="form-label" style="justify-content:space-between;">
            <span>Email</span>
            <span class="form-opt">From Google account</span>
          </label>
          <input class="form-input readonly" type="email" value="Adarshsingh@gmail.comm" readonly>
        </div>

      </div>

      <!-- BUSINESS INFO -->
      <div class="form-card">
        <div class="form-card-title">Business Info <span
            style="font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--t3);margin-left:4px;">optional
            — for GST invoicing</span></div>

        <!-- GSTIN -->
        <div class="form-group">
          <label class="form-label">
            GSTIN
            <span class="form-opt">Optional</span>
          </label>
          <input class="form-input gstin" type="text" placeholder="29AABCU9603R1ZX" maxlength="15">
          <div class="form-hint">15-character GST Identification Number. Example: <code>29AABCU9603R1ZX</code></div>
        </div>

      </div>

      <!-- ACCOUNT INFO -->
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">Account type</span>
          <span class="info-value">Property Owner</span>
        </div>
        <div class="info-div"></div>
        <div class="info-row">
          <span class="info-label">Member since</span>
          <span class="info-value">June 2026</span>
        </div>
        <div class="info-div"></div>
        <div class="info-row">
          <span class="info-label">Bank account</span>
          <span class="info-chip">Verified</span>
        </div>
      </div>

      <!-- SAVE BUTTON (enabled — has unsaved changes) -->
      <button class="btn-save">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 12 9 17 20 6" />
        </svg>
        Save Changes
      </button>

    </div><!-- /scroll -->

  </div><!-- /phone -->

</body>

</html>
