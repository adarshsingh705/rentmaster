<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentMaster — Add Property</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #2A2D35; display: flex; justify-content: center; align-items: flex-start; padding: 48px 20px 80px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
:root {
  --navy: #1C2537; --navy2: #6B5B45; --saffron: #C8A96E;
  --t1: #1C2537; --t2: #6B5B45; --t3: #9B8E7E;
  --card: #FAF8F5; --bg: #F0EDE8; --border: #E2D9CC;
  --sh: 0 1px 3px rgba(28,37,55,.06), 0 2px 8px rgba(28,37,55,.05);
  --paid: #0E9F6E; --paid-bg: rgba(14,159,110,.09);
  --pend: #D97706;
}
.phone { width: 375px; background: var(--bg); border-radius: 40px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.28), 0 4px 16px rgba(0,0,0,.1); border: 1px solid rgba(255,255,255,.08); position: relative; }
.scroll { height: 780px; overflow-y: auto; padding-bottom: 80px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.topbar { padding: 52px 18px 14px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.back-btn { color: var(--navy2); cursor: pointer; }
.tb-title { font-size: 16px; font-weight: 800; color: var(--t1); flex: 1; }
.content { padding: 16px; }
.card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--sh); overflow: hidden; margin-bottom: 12px; }
.card-hdr { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.card-ttl { font-size: 14px; font-weight: 800; color: var(--t1); margin-bottom: 3px; }
.card-sub { font-size: 11px; color: var(--t2); }
.card-body { padding: 14px 16px; }
.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.type-opt { border-radius: 11px; border: 1.5px solid var(--border); padding: 14px 12px; cursor: pointer; background: var(--bg); transition: all .12s; text-align: center; }
.type-opt.on { border-color: var(--navy); background: rgba(28,37,55,.04); }
.type-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
.type-name { font-size: 13px; font-weight: 700; color: var(--t1); margin-bottom: 3px; }
.type-desc { font-size: 10px; color: var(--t3); line-height: 1.4; }
.form-group { margin-bottom: 13px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--t2); display: block; margin-bottom: 5px; }
.form-input { width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--t1); background: var(--card); outline: none; }
.form-input:focus { border-color: var(--navy); }
.form-input::placeholder { color: var(--t3); }
.form-select { width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--t1); background: var(--card); outline: none; }
.form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 13px; }
.input-prefix-wrap { display: flex; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
.input-prefix-wrap:focus-within { border-color: var(--navy); }
.input-prefix { padding: 10px 11px; background: var(--bg); color: var(--t2); font-size: 13px; font-weight: 600; border-right: 1.5px solid var(--border); }
.input-prefix-wrap input { flex: 1; border: none; padding: 10px 13px; font-size: 14px; font-family: inherit; color: var(--t1); background: transparent; outline: none; }
.room-counter { display: flex; align-items: center; gap: 12px; }
.count-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--bg); color: var(--t1); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 300; }
.count-val { font-size: 22px; font-weight: 800; color: var(--t1); min-width: 36px; text-align: center; }
.footer-btns { display: flex; gap: 10px; padding: 12px 16px; background: var(--card); border-top: 1px solid var(--border); }
.btn-cancel { flex: 1; padding: 12px; background: var(--bg); color: var(--t1); border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
.btn-next { flex: 2; padding: 12px; background: var(--navy); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
.bnav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; border-top: 1px solid var(--border); padding: 12px 18px 22px; border-radius: 0 0 40px 40px; }
.ni { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; font-weight: 500; color: var(--t3); cursor: pointer; text-decoration: none; }
.ni.on { color: var(--navy); }
</style>
</head>
<body>
<div class="phone">
<div class="scroll">
  <div class="topbar">
    <a class="back-btn" href="dashboard-mobile.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <div class="tb-title">Add Property</div>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-hdr"><div class="card-ttl">Property type</div><div class="card-sub">Choose how rent is charged in this property</div></div>
      <div class="card-body">
        <div class="type-grid">
          <div class="type-opt on" onclick="this.parentElement.querySelectorAll('.type-opt').forEach(e=>e.classList.remove('on'));this.classList.add('on')">
            <div class="type-icon" style="background:rgba(28,37,55,.07);color:var(--navy)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4v16M2 8h18a2 2 0 012 2v10M2 14h20"/></svg></div>
            <div class="type-name">PG / Hostel</div>
            <div class="type-desc">Bed-based billing, shared rooms</div>
          </div>
          <div class="type-opt" onclick="this.parentElement.querySelectorAll('.type-opt').forEach(e=>e.classList.remove('on'));this.classList.add('on')">
            <div class="type-icon" style="background:rgba(14,159,110,.08);color:var(--paid)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01"/></svg></div>
            <div class="type-name">Flat / House</div>
            <div class="type-desc">Room-based billing, individual units</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-ttl">Property details</div></div>
      <div class="card-body">
        <div class="form-group"><label class="form-label">Property name</label><input class="form-input" type="text" placeholder="e.g. Sunshine PG" value="Koramangala PG"></div>
        <div class="form-group"><label class="form-label">Full address</label><input class="form-input" type="text" placeholder="Street, area, city" value="42 3rd Cross, Koramangala, Bangalore"></div>
        <div class="form-row2">
          <div><label class="form-label">City</label><input class="form-input" type="text" placeholder="City" value="Bangalore"></div>
          <div><label class="form-label">State</label><select class="form-select"><option selected>Karnataka</option><option>Maharashtra</option><option>Delhi</option><option>Tamil Nadu</option></select></div>
        </div>
        <div class="form-group"><label class="form-label">Number of rooms</label>
          <div class="room-counter">
            <button class="count-btn" onclick="const v=document.getElementById('rc');if(parseInt(v.textContent)>1)v.textContent=parseInt(v.textContent)-1">−</button>
            <div class="count-val" id="rc">8</div>
            <button class="count-btn" onclick="const v=document.getElementById('rc');v.textContent=parseInt(v.textContent)+1">+</button>
            <span style="font-size:12px;color:var(--t3)">rooms</span>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Default rent per bed <span style="color:var(--t3);font-weight:400">(optional)</span></label>
          <div class="input-prefix-wrap"><span class="input-prefix">₹</span><input type="number" placeholder="8500"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer-btns">
    <a href="dashboard-mobile.html" class="btn-cancel" style="text-decoration:none;text-align:center">Cancel</a>
    <button class="btn-next" onclick="location.href='room-setup-mobile.html'">Set Up Rooms →</button>
  </div>
</div>
<div class="bnav">
  <a class="ni on" href="dashboard-mobile.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
  <a class="ni" href="tenants-mobile.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Tenants</span></a>
  <a class="ni" href="payments-mobile.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span>Payments</span></a>
  <a class="ni" href="settings-mobile.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></a>
</div>
</div>
</body>
</html>
